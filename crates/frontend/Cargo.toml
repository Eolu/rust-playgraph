[package]
name = "rust-playgraph"
description = "Visual playground for composing directed graphs in the browser"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
playgraph-core = { path = "../core" }
yew = { version = "0.20", features = ["csr"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "HtmlTextAreaElement",
    "HtmlInputElement",
    "HtmlSelectElement",
    "HtmlAnchorElement",
    "DragEvent",
    "DataTransfer",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "Element",
    "DomRect",
    "MouseEvent",
    "InputEvent",
    "Blob",
    "Url",
    "File",
    "FileList",
    "FileReader",
    "Storage",
] }
gloo-net = { version = "0.4", features = ["http"] }
gloo = "0.10"
wasm-bindgen-futures = "0.4"
serde.workspace = true
serde_json.workspace = true
uuid = { version = "1", features = ["v4", "js"] }
