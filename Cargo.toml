[workspace]
resolver = "3"
members = ["crates/core", "crates/backend", "crates/frontend"]
default-members = ["crates/core", "crates/backend"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
thiserror = "2"
prettyplease = "0.2"

[profile.release]
opt-level = "s"
lto = true
